name: Update work history data

on:
  workflow_dispatch:
    inputs:
      recency:
        description: "Number of recent days to fetch (default: 2)"
        required: false
        default: "2"
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

env:
  # Set these
  USERNAME: ${{ github.repository_owner }}
  PROJECT_NUMBER: 4
  # Let these set themselves
  REPO_OWNER: ${{ github.repository_owner }}
  REPO_OWNER_TYPE: ${{ fromJSON('{"Organization":"orgs","User":"users"}')[github.event.repository.owner.type] }}

jobs:
  Update:
    runs-on: ubuntu-latest
    # The checkout and pushes use the workflow's own `GITHUB_TOKEN`, so this job needs write access.
    # The `GH_PAT` secret only reads the activity and writes the project boards; it never pushes.
    permissions:
      contents: write

    # `CodyCBakerPhD/historia/action@v0.10.15` cannot be used: the files under `action/` at that tag
    # were already bumped to `0.10.16`, a release that does not exist, so every `uses:` inside the
    # composite resolves to a missing tag. The steps below are that composite, inlined against the
    # latest published image.
    steps:
      # The checkout persists this token in the git config, so every `git push` below uses it too.
      - name: Check out the data repository
        uses: actions/checkout@v7
        with:
          token: ${{ github.token }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update work history data
        uses: docker://ghcr.io/codycbakerphd/historia:0.10.15
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        with:
          args: update github --directory ./history --username ${{ env.USERNAME }} --recency ${{ inputs.recency || '2' }}

      # The update runs in a container as root, so the files it wrote are root-owned and the steps
      # below, which run as the unprivileged runner user, could not otherwise commit them.
      - name: Restore workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Commit and push new content
        run: |
          git add .
          git diff --quiet --cached || git commit --message update
          git push

      - name: Populate the personal project
        uses: docker://ghcr.io/codycbakerphd/historia:0.10.15
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        with:
          # An action always runs headless, so the confirmation prompt is never answerable.
          args: project populate --directory ./history --url https://github.com/${{ env.REPO_OWNER_TYPE }}/${{ env.REPO_OWNER }}/projects/${{ env.PROJECT_NUMBER }} --placeholder 180 --yes

      - name: Update personal project dates
        uses: docker://ghcr.io/codycbakerphd/historia:0.10.15
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        with:
          args: project update dates --url https://github.com/${{ env.REPO_OWNER_TYPE }}/${{ env.REPO_OWNER }}/projects/${{ env.PROJECT_NUMBER }} --placeholder 180

      - name: Push to CON project
        uses: docker://ghcr.io/codycbakerphd/historia:0.10.15
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        with:
          args: project populate --directory ./history --url https://github.com/orgs/con/projects/6 --status Incoming --yes

      # Last, because it leaves the checkout on the orphan archive branch.
      - name: Push the compressed archive
        run: |
          tar -czf content.tar.gz history
          git branch -D dist || true
          git checkout --orphan dist
          git rm -rf --cached .
          git add content.tar.gz
          git commit --message "update dist archive [skip ci]"
          git push --force origin HEAD:dist

  NotifyOnFailure:
    runs-on: ubuntu-latest
    needs: [ Update ]
    if: ${{ always() && failure() }}
    steps:
      - uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Work history data update failed"
          to: cody.c.baker.phd@gmail.com
          from: work-history-data <${{ secrets.MAIL_USERNAME }}>
          body: "Please check the latest run of my work history update: https://github.com/codycbakerphd/work-history-data/actions/workflows/update.yml"
