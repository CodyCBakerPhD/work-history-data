name: Update work history data

on:
  workflow_dispatch:
    inputs:
      recency:
        description: "Number of recent days to fetch (default: 2)"
        required: false
        default: "2"
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

env:
  # Set these
  USERNAME: ${{ github.repository_owner }}
  PROJECT_NUMBER: 4
  # Let these set themselves
  REPO_OWNER: ${{ github.repository_owner }}
  REPO_OWNER_TYPE: ${{ fromJSON('{"Organization":"orgs","User":"users"}')[github.event.repository.owner.type] }}

jobs:
  Update:
    runs-on: ubuntu-latest
    # The checkout and pushes use the workflow's own `GITHUB_TOKEN`, so this job needs write access.
    # The `GH_PAT` secret only reads the activity and writes the project boards; it never pushes.
    permissions:
      contents: write

    steps:
      # THROWAWAY BRANCH. This is `claude/historia-version-mismatch-miu0zy` wired to the unmerged
      # CodyCBakerPhD/historia-action#4 and CodyCBakerPhD/historia#183 so both can be exercised
      # against real boards before either merges. Never merge this branch.
      #
      # Checks out the repository, fetches recent activity, commits and pushes the new content,
      # and populates the personal project. The archive is disabled so the test cannot force-push
      # over `dist`, and the date refresh is no longer part of the composite.
      - name: Run work history update
        uses: CodyCBakerPhD/historia-action@claude/split-date-refresh-from-composite
        with:
          username: ${{ env.USERNAME }}
          project-url: https://github.com/${{ env.REPO_OWNER_TYPE }}/${{ env.REPO_OWNER }}/projects/${{ env.PROJECT_NUMBER }}
          token: ${{ secrets.GH_PAT }}
          recency: ${{ inputs.recency || '2' }}
          archive-branch: ""

      # The `dev` image is built from `claude/project-update-dates-recency`, so this is the only
      # place `--recency` exists yet. The step the composite used to run walked all 3855 items.
      - name: Refresh personal project dates
        uses: docker://ghcr.io/codycbakerphd/historia:dev
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        with:
          args: project update dates --url https://github.com/${{ env.REPO_OWNER_TYPE }}/${{ env.REPO_OWNER }}/projects/${{ env.PROJECT_NUMBER }} --placeholder 180 --recency 2

      # The `project-populate` action does not expose `--status`, so use the same image the actions
      # pin directly to keep the custom `Incoming` status for the CON project.
      - name: Push to CON project
        uses: docker://ghcr.io/codycbakerphd/historia:0.10.15
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        with:
          args: project populate --directory ./history --url https://github.com/orgs/con/projects/6 --status Incoming --yes

  NotifyOnFailure:
    runs-on: ubuntu-latest
    needs: [ Update ]
    if: ${{ always() && failure() }}
    steps:
      - uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Work history data update failed"
          to: cody.c.baker.phd@gmail.com
          from: work-history-data <${{ secrets.MAIL_USERNAME }}>
          body: "Please check the latest run of my work history update: https://github.com/codycbakerphd/work-history-data/actions/workflows/update.yml"
