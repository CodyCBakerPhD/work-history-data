name: Update work history data

on:
  workflow_dispatch:
    inputs:
      recency:
        description: "Number of recent days to fetch (default: 2)"
        required: false
        default: "2"
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

env:
  # Set these
  USERNAME: ${{ github.repository_owner }}
  PROJECT_NUMBER: 4
  HISTORIA_VERSION: 0.10.14
  # Let these set themselves
  REPO_OWNER: ${{ github.repository_owner }}
  REPO_OWNER_TYPE: ${{ fromJSON('{"Organization":"orgs","User":"users"}')[github.event.repository.owner.type] }}

jobs:
  Update:
    runs-on: ubuntu-latest

    steps:
      # Checks out the repository, fetches recent activity, commits and pushes the new content,
      # populates the personal project (and refreshes its dates), and force-pushes the compressed
      # archive to the `dist` branch.
      - name: Run work history update
        uses: CodyCBakerPhD/historia/action@v0.10.14
        with:
          username: ${{ env.USERNAME }}
          project-url: https://github.com/${{ env.REPO_OWNER_TYPE }}/${{ env.REPO_OWNER }}/projects/${{ env.PROJECT_NUMBER }}
          token: ${{ secrets._GITHUB_API_KEY }}
          recency: ${{ inputs.recency || '2' }}

      # The vendored `project-populate` action does not expose `--status`, so run the same pinned
      # container image directly to keep the custom `Incoming` status for the CON project.
      - name: Push to CON project
        env:
          GITHUB_TOKEN: ${{ secrets._GITHUB_API_KEY }}
        run: |
          docker run --rm \
            --env GITHUB_TOKEN \
            --volume "$PWD:/github/workspace" \
            --workdir /github/workspace \
            "ghcr.io/codycbakerphd/historia:$HISTORIA_VERSION" \
            project populate --directory ./history --url https://github.com/orgs/con/projects/6 --status Incoming --yes

  NotifyOnFailure:
    runs-on: ubuntu-latest
    needs: [ Update ]
    if: ${{ always() && failure() }}
    steps:
      - uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Work history data update failed"
          to: cody.c.baker.phd@gmail.com
          from: work-history-data <${{ secrets.MAIL_USERNAME }}>
          body: "Please check the latest run of my work history update: https://github.com/codycbakerphd/work-history-data/actions/workflows/update.yml"
