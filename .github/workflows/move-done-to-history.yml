name: Move DONE to History

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  Transition:
    runs-on: ubuntu-latest

    steps:
      - name: Run transition
        uses: docker://ghcr.io/codycbakerphd/historia:0.10.15
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        with:
          # An action always runs headless, so the confirmation prompt is never answerable.
          args: project transition --url https://github.com/orgs/con/projects/6 --current DONE --new History --yes

  NotifyOnFailure:
    runs-on: ubuntu-latest
    needs: [ Transition ]
    if: ${{ always() && failure() }}
    steps:
      - uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Work history data update failed"
          to: cody.c.baker.phd@gmail.com
          from: work-history-data <${{ secrets.MAIL_USERNAME }}>
          body: "Please check the latest run of my work history update: https://github.com/codycbakerphd/work-history-data/actions/workflows/update.yml"
